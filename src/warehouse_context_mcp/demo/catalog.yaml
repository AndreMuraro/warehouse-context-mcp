# Curated context for the synthetic demo warehouse.
# In a real deployment this is generated from dbt docs, Unity Catalog comments or a data
# catalog, then reviewed in Git like code.
tables:
  dim_vessels:
    description: One row per vessel in the fleet register.
    owner: fleet-data
    grain: vessel_id
    freshness_column: updated_at
    expected_freshness_hours: 24
    columns:
      vessel_id: { description: "Surrogate key." }
      vessel_name: { description: "Registered vessel name." }
      vessel_class: { description: "Size class: VLCC, Suezmax, Aframax, LR2 or MR." }
      dwt_tonnes: { description: "Deadweight tonnage in metric tonnes." }
      built_year: { description: "Year of delivery from the shipyard." }

  dim_charterers:
    description: Companies that charter vessels. Contact details are personal data.
    owner: commercial-ops
    grain: charterer_id
    freshness_column: updated_at
    expected_freshness_hours: 168
    columns:
      charterer_id: { description: "Surrogate key." }
      charterer_name: { description: "Legal entity name." }
      contact_email: { description: "Operations contact. Personal data.", pii: true }
      country: { description: "ISO 3166-1 alpha-2 country of the legal entity." }

  stg_voyages:
    description: Voyages as received from the fixtures system, lightly cleaned.
    owner: fleet-data
    grain: voyage_id
    upstream: [raw_fixture_messages, dim_vessels, dim_charterers]
    freshness_column: loaded_at
    expected_freshness_hours: 12
    columns:
      voyage_id: { description: "Fixture identifier." }
      laycan_start: { description: "First day of the loading window." }
      cargo_tonnes: { description: "Contracted cargo quantity in metric tonnes." }

  fct_voyage_economics:
    description: >
      Time-charter-equivalent economics per voyage. tce_usd_per_day is
      (revenue_usd - voyage_costs_usd) / duration_days.
    owner: freight-analytics
    grain: voyage_id
    upstream: [stg_voyages]
    freshness_column: computed_at
    expected_freshness_hours: 12
    columns:
      revenue_usd: { description: "Freight revenue in USD." }
      voyage_costs_usd: { description: "Bunkers, port costs and canal dues in USD." }
      duration_days: { description: "Days from load port arrival to discharge completion." }
      tce_usd_per_day: { description: "Time-charter equivalent in USD per day." }

  raw_fixture_messages:
    description: >
      Raw messages from the fixtures system, one row per message. A voyage is sent again
      each time it is amended, so it can appear several times and only its latest message
      is current. Use stg_voyages for analysis.
    owner: fleet-data
    grain: message_id
    freshness_column: received_at
    expected_freshness_hours: 12
    columns:
      message_id: { description: "Message sequence number." }
      voyage_id: { description: "Fixture identifier; repeats across amendments." }
      cargo_tonnes: { description: "Cargo quantity as of this message, not necessarily current." }
      received_at: { description: "When the message arrived." }

  legacy_voyage_pnl:
    description: >
      DEPRECATED, do not use: the voyage P&L from the previous economics model, frozen
      when fct_voyage_economics replaced it. It covers older voyages only, its revenue is
      net of a 5% address commission and its duration includes ballast days, so its
      figures differ from the current definitions.
    owner: freight-analytics
    grain: voyage_id
    freshness_column: computed_at
    expected_freshness_hours: 12
    columns:
      revenue_usd: { description: "Revenue net of address commission (old definition)." }
      costs_usd: { description: "Voyage costs in USD." }
      duration_days: { description: "Laden plus ballast days (old definition)." }
      tce_usd_per_day: { description: "TCE under the old definitions." }
