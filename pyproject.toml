[project]
name = "warehouse-context-mcp"
version = "0.1.0"
description = "An MCP server that gives AI agents trustworthy, governed context about a data warehouse: docs, lineage, freshness, and read-only queries with guardrails."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "André Muraro" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "duckdb>=1.0",
    "sqlglot>=25",
    "pyyaml>=6",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
warehouse-context-mcp = "warehouse_context_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_context_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
