[project]
name = "warehouse-context-mcp"
version = "0.2.0"
description = "An MCP server that gives AI agents trustworthy, governed context about a data warehouse: docs, lineage, freshness, and read-only queries with guardrails."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "André Muraro" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "duckdb>=1.0",
    "sqlglot>=25",
    "pyyaml>=6",
    "pydantic>=2.6",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.12"]
databricks = ["databricks-sql-connector>=3.4"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
warehouse-context-mcp = "warehouse_context_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_context_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["snowflake.*", "databricks.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real warehouse credentials in the environment"]
pythonpath = ["src"]
