name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job gets more than it needs; nothing here can publish.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIZMOR_VERSION: "1.32.0"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format github
      - run: uv run ty check --output-format github
      - name: Workflow security (zizmor)
        run: uvx "zizmor==${ZIZMOR_VERSION}" --offline --format github .github/workflows/
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Known vulnerabilities in locked dependencies (pip-audit)
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt > requirements.txt
          uvx "pip-audit==${PIP_AUDIT_VERSION}" --requirement requirements.txt --disable-pip --strict

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.14", "3.15"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # The snowflake extra is skipped on 3.15 by its environment marker.
      - run: uv sync --locked --all-extras
      - run: uv run pytest --cov --cov-report=term

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build
      - run: uvx --from dist/*.whl warehouse-context-mcp --version

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: warehouse-context-mcp:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image vulnerabilities with a fix available (grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: warehouse-context-mcp:local
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
      - name: stdio transport answers initialize
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 60 docker run --rm -i warehouse-context-mcp:local | tee stdio.json
          grep -q '"name":"warehouse-context"' stdio.json
      - name: Compose service becomes healthy
        run: docker compose up --detach --wait --wait-timeout 90 demo
      - name: HTTP transport serves tools and refuses foreign hosts
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -X POST http://127.0.0.1:8000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H 'Mcp-Protocol-Version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"run_query","arguments":{"sql":"select vessel_class, count(*) n from dim_vessels group by 1"}}}' \
            | tee http.json
          grep -q '"ok":true' http.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp \
            -H 'Host: attacker.example' -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' -d '{}')
          test "$code" = 421
      - name: Runs as non-root on a read-only filesystem
        run: |
          test "$(docker compose exec -T demo id -u)" = 10001
          if docker compose exec -T demo touch /opt/venv/probe; then
            echo "filesystem is writable"; exit 1
          fi
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
