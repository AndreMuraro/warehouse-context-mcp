name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format github
      - run: uv run ty check --output-format github

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.14", "3.15"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # The snowflake extra is skipped on 3.15 by its environment marker.
      - run: uv sync --locked --all-extras
      - run: uv run pytest --cov --cov-report=term

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx --from dist/*.whl warehouse-context-mcp --version

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: warehouse-context-mcp:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: stdio transport answers initialize
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 60 docker run --rm -i warehouse-context-mcp:local | tee stdio.json
          grep -q '"name":"warehouse-context"' stdio.json
      - name: Compose service becomes healthy
        run: docker compose up --detach --wait --wait-timeout 90 demo
      - name: HTTP transport serves tools and refuses foreign hosts
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -X POST http://127.0.0.1:8000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H 'Mcp-Protocol-Version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"run_query","arguments":{"sql":"select vessel_class, count(*) n from dim_vessels group by 1"}}}' \
            | tee http.json
          grep -q '"ok":true' http.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp \
            -H 'Host: attacker.example' -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' -d '{}')
          test "$code" = 421
      - name: Runs as non-root on a read-only filesystem
        run: |
          test "$(docker compose exec -T demo id -u)" = 10001
          if docker compose exec -T demo touch /opt/venv/probe; then
            echo "filesystem is writable"; exit 1
          fi
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  # --- releases: only for version tags --------------------------------------------------------

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build, container]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/warehouse-context-mcp
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing: no stored token
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      - run: uv publish --trusted-publishing always

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/andremuraro/warehouse-context-mcp  # image names must be lower-case
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  mcp-registry:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # grants the io.github.AndreMuraro/* namespace
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Publish (retries while PyPI propagates the new release)
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
